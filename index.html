<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Shared House — Shared Display</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- Shared Display: 1920 × 1080 -->
    <main class="screen">
      <!-- Furniture selection menu -->
      <aside
        id="furnitureMenu"
        class="furniture-menu"
        aria-label="Furniture Selection"
      ></aside>

      <!-- Room grid and placed furniture -->
      <div id="roomGrid" class="room-grid" aria-label="Shared Room Grid"></div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
